<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before You Begin Â· Tejal Desae</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/cursor.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/responsive.css">
  <style>
    body { background: var(--forest-deep); color: var(--gold); min-height: 100vh; display: flex; flex-direction: column; }
    .video-shell { flex: 1; display: flex; align-items: center; justify-content: center; padding: clamp(32px,6vw,80px) clamp(20px,5vw,40px); }
    .video-stage { width: 100%; max-width: 720px; text-align: center; }
    .video-eyebrow { font-size: .68rem; font-weight: 600; letter-spacing: .45em; text-transform: uppercase; color: rgba(var(--gold-rgb),.6); display: block; margin-bottom: 24px; }
    .video-title { font-family: var(--serif); font-size: clamp(2rem,5vw,3.2rem); font-weight: 500; line-height: 1.08; color: var(--white); margin-bottom: 16px; }
    .video-title em { font-style: italic; color: var(--gold); }
    .video-sub { font-size: .98rem; color: rgba(var(--gold-rgb),.65); line-height: 1.8; max-width: 480px; margin: 0 auto 44px; }
    .video-wrap { position: relative; width: 100%; padding-top: 56.25%; background: rgba(255,255,255,.04); border: 1px solid rgba(var(--gold-rgb),.18); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 44px; }
    .video-wrap video, .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .video-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .video-placeholder-icon { font-size: 3rem; opacity: .3; }
    .video-placeholder-text { font-size: .8rem; color: rgba(var(--gold-rgb),.35); letter-spacing: .15em; text-transform: uppercase; }
    .video-cta-row { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .video-note { font-size: .78rem; color: rgba(var(--gold-rgb),.4); }
    #proceed-btn { opacity: .4; pointer-events: none; transition: opacity .5s; }
    #proceed-btn.ready { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="wm">Tejal Desae</span>
  </div>

  <div class="video-shell">
    <div class="video-stage">
      <span class="video-eyebrow">Before You Begin</span>
      <h1 class="video-title">Watch this before<br><em>your assessment</em></h1>
      <p class="video-sub">Tejal has a message for you. Watch to the end â€” then continue to your Wealth Expansion Profile.</p>

      <div class="video-wrap" id="video-container">
        <!-- Drop your VSL video file at assets/videos/tejal-vsl.mp4 -->
        <video id="vsl-video" controls playsinline preload="metadata"
               poster=""
               onerror="document.getElementById('video-container').innerHTML=document.getElementById('video-fallback').innerHTML">
          <source src="assets/videos/tejal-vsl.mp4" type="video/mp4">
        </video>
        <!-- Fallback if video not yet uploaded -->
        <div id="video-fallback" style="display:none;">
          <div class="video-placeholder">
            <div class="video-placeholder-icon">â–·</div>
            <div class="video-placeholder-text">Video coming soon</div>
          </div>
        </div>
      </div>

      <div class="video-cta-row">
        <a href="apply-money-energetics.html" class="btn-champ" id="proceed-btn" style="padding:18px 48px;border-radius:3px;font-size:13px;">
          Continue to Your Wealth Expansion Profile â†’
        </a>
        <span class="video-note" id="video-note">Watch the video to unlock your assessment</span>
      </div>
    </div>
  </div>

  <script>
    // Store program in sessionStorage (set by query param)
    const params = new URLSearchParams(location.search);
    const prog = params.get('program') || 'money-energetics';
    sessionStorage.setItem('tejal_program', prog);

    // Update proceed link based on program
    const progLinks = {
      'money-energetics': 'apply-money-energetics.html',
      'wealth-oracle':    'apply-wealth-oracle.html',
      'divine-wealth':    'apply-divine-wealth.html',
      'sovereign-mentor': 'apply-sovereign-mentor.html',
      'inner-sanctum':    'apply-inner-sanctum.html',
    };
    const btn = document.getElementById('proceed-btn');
    btn.href = progLinks[prog] || 'apply-money-energetics.html';

    // Unlock button after video reaches 80% or ends
    const video = document.getElementById('vsl-video');
    const note = document.getElementById('video-note');
    function unlock() {
      btn.classList.add('ready');
      note.textContent = 'Ready â€” continue to your assessment';
    }
    if (video) {
      video.addEventListener('timeupdate', () => {
        if (video.duration && video.currentTime / video.duration >= 0.8) unlock();
      });
      video.addEventListener('ended', unlock);
      // If video errors or not present, unlock after 3s for UX
      video.addEventListener('error', () => { setTimeout(unlock, 3000); });
    } else {
      setTimeout(unlock, 3000);
    }
    // Also unlock if no video found at all
    setTimeout(unlock, 4000);
  </script>
</body></html>
