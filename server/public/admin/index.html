<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Tejal Desae</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest:#154230; --forest-deep:#0E3122; --forest-light:rgba(21,66,48,.08);
      --gold:#e6d3a3; --gold-deep:#C7AC6D; --gold-text:#9C7F39;
      --sand:#e4d9c4; --sand-lt:#F0E9D8;
      --paper:#FBFAF5; --white:#fff;
      --ink:#23302A; --ink-soft:rgba(35,48,42,.7); --ink-faint:rgba(35,48,42,.45);
      --danger:#c0392b; --success:#1a7a4a;
      --serif:'Cormorant Garamond',serif; --sans:'Jost',sans-serif;
      --radius:6px; --shadow:0 2px 12px rgba(21,66,48,.10);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;font-family:var(--sans);color:var(--ink);background:var(--sand-lt);font-size:14px;line-height:1.5}
    a{color:inherit;text-decoration:none}
    button{font-family:var(--sans);cursor:pointer}

    /* ── Login ── */
    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--forest-deep);}
    .login-card{background:var(--paper);border-radius:var(--radius);padding:48px 44px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.3);}
    .login-card h1{font-family:var(--serif);font-size:1.8rem;font-weight:500;color:var(--forest);margin-bottom:6px}
    .login-card .sub{font-size:.82rem;color:var(--ink-faint);margin-bottom:32px}
    .field{margin-bottom:18px}
    .field label{display:block;font-size:.68rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-text);margin-bottom:6px}
    .field input{width:100%;padding:11px 14px;border:1px solid rgba(199,172,109,.4);border-radius:var(--radius);font-family:var(--sans);font-size:.9rem;color:var(--ink);background:var(--white);transition:border-color .25s}
    .field input:focus{outline:none;border-color:var(--forest)}
    .btn-primary{width:100%;padding:13px;background:var(--forest);color:var(--gold);border:none;border-radius:var(--radius);font-size:.88rem;font-weight:600;letter-spacing:.08em;transition:background .3s}
    .btn-primary:hover{background:var(--forest-deep)}
    .login-err{color:var(--danger);font-size:.8rem;margin-top:12px;min-height:1em}
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login-screen">
    <div class="login-card">
      <h1>Tejal Desae</h1>
      <p class="sub">Admin Dashboard — Secure Access</p>
      <div class="field"><label>Email</label><input type="email" id="l-email" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="l-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
      <button class="btn-primary" onclick="login()">Sign In</button>
      <div class="login-err" id="l-err"></div>
    </div>
  </div>

  <!-- Dashboard (hidden until logged in) -->
  <div id="app" style="display:none">
    <link rel="stylesheet" href="dashboard.css">
    <div id="dashboard-root"></div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
